name: Feature Pipeline (Hourly)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-feature-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          for i in {1..3}; do
            pip install -r requirements.txt && break
            echo "Attempt $i failed, retrying..."
            sleep 10
          done

      - name: Run Feature Pipeline
        env:
          AQICN_TOKEN: ${{ secrets.AQICN_TOKEN }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: |
          cd src
          python feature_pipeline.py

      - name: Commit and push CSV
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/features.csv
          git commit -m "Update features CSV - $(date)" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main

      - name: Notify on failure
        if: failure()
        run: echo "Feature pipeline failed at $(date)" >> pipeline_errors.log